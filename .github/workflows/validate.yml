name: validate-skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional rasteriser
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
      - name: Lint skill manifests
        run: python scripts/validate_skills.py
      - name: End-to-end script tests
        run: sh tests/run_all.sh
